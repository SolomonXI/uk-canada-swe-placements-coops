name: Update listings

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# The workflow updates committed listing data and README content.  GitHub tokens
# are read-only by default for many repositories, so explicitly request the
# minimum write scope needed for the final push.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scrapers
        run: python -m scrapers

      - name: Regenerate README
        run: python scripts/generate_readme.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/listings.json README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update listings"
          git push
